<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1673723146227353" crossorigin="anonymous"></script>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Go Live — VaultStream</title>
<script src="https://download.agora.io/sdk/release/AgoraRTC_N.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap');
:root { --bg: #0f0f0f; --surface: #1a1a1a; --surface2: #272727; --border: #3f3f3f; --text: #f1f1f1; --text2: #aaaaaa; --accent: #ff0000; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Roboto', sans-serif; }
nav { display: flex; align-items: center; gap: 16px; padding: 0 16px; height: 56px; border-bottom: 1px solid var(--border); background: var(--bg); position: fixed; top: 0; left: 0; right: 0; z-index: 200; }
.logo { display: flex; align-items: center; gap: 6px; text-decoration: none; color: var(--text); }
.logo-icon { background: var(--accent); color: white; padding: 4px 8px; border-radius: 6px; font-size: 0.85rem; font-weight: 700; }
.logo-text { font-size: 1.1rem; font-weight: 700; }
.nav-right { margin-left: auto; display: flex; gap: 10px; align-items: center; }
.btn { padding: 7px 16px; border-radius: 20px; border: 1px solid var(--border); background: none; color: var(--text); font-size: 0.82rem; cursor: pointer; text-decoration: none; font-family: 'Roboto', sans-serif; }
.main { margin-top: 80px; max-width: 900px; margin-left: auto; margin-right: auto; padding: 0 20px 40px; }
.setup-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 28px; margin-bottom: 24px; }
.setup-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 20px; }
.field { margin-bottom: 16px; }
label { display: block; font-size: 0.82rem; color: var(--text2); margin-bottom: 6px; }
input[type="text"] { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; color: var(--text); font-size: 0.88rem; font-family: 'Roboto', sans-serif; outline: none; }
input[type="text"]:focus { border-color: var(--accent); }
.go-live-btn { display: flex; align-items: center; gap: 8px; padding: 12px 28px; border-radius: 8px; border: none; background: var(--accent); color: white; font-size: 0.95rem; font-weight: 600; font-family: 'Roboto', sans-serif; cursor: pointer; }
.go-live-btn:hover { background: #cc0000; }
.live-dot { width: 10px; height: 10px; border-radius: 50%; background: white; animation: pulse 1.5s infinite; }
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.3} }
.stream-wrap { display: none; }
.stream-wrap.show { display: block; }
.video-container { position: relative; border-radius: 12px; overflow: hidden; background: #000; aspect-ratio: 16/9; margin-bottom: 16px; }
#local-video { width: 100%; height: 100%; }
.live-badge { position: absolute; top: 12px; left: 12px; background: var(--accent); color: white; font-size: 0.72rem; font-weight: 700; padding: 4px 10px; border-radius: 4px; display: flex; align-items: center; gap: 5px; }
.viewer-badge { position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,0.7); color: white; font-size: 0.78rem; padding: 4px 10px; border-radius: 4px; }
.stream-controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
.ctrl-btn { padding: 8px 18px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-size: 0.82rem; cursor: pointer; font-family: 'Roboto', sans-serif; transition: all 0.2s; }
.ctrl-btn:hover { background: #444; }
.ctrl-btn.danger { border-color: #ff4444; color: #ff4444; }
.share-box { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
.share-url { flex: 1; font-size: 0.82rem; color: var(--text2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.copy-btn { padding: 5px 12px; border-radius: 6px; border: 1px solid var(--border); background: none; color: var(--text); font-size: 0.78rem; cursor: pointer; font-family: 'Roboto', sans-serif; white-space: nowrap; }
.not-logged { text-align: center; padding: 60px; color: var(--text2); }
.not-logged a { color: var(--accent); text-decoration: none; }
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--surface2); color: var(--text); border-radius: 8px; padding: 12px 24px; font-size: 0.85rem; font-weight: 500; box-shadow: 0 4px 20px rgba(0,0,0,0.5); z-index: 999; transition: transform 0.3s; }
.toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<nav>
  <a href="/" class="logo"><div class="logo-icon">VS</div><div class="logo-text">VaultStream</div></a>
  <div class="nav-right">
    {% if user %}
      <a href="/profile/{{ user.username }}" class="btn">👤 {{ user.username }}</a>
      <a href="/logout" class="btn">Logout</a>
    {% else %}
      <a href="/login" class="btn">Sign in</a>
    {% endif %}
  </div>
</nav>

<div class="main">
  {% if user %}
  <div class="setup-card" id="setup-card">
    <div class="setup-title">🔴 Go Live</div>
    <div class="field">
      <label>Stream Title</label>
      <input type="text" id="stream-title" placeholder="What are you streaming today?" maxlength="80">
    </div>
    <button class="go-live-btn" id="go-live-btn">
      <div class="live-dot"></div> Start Streaming
    </button>
  </div>

  <div class="stream-wrap" id="stream-wrap">
    <div class="video-container">
      <div id="local-video"></div>
      <div class="live-badge"><div class="live-dot"></div> LIVE</div>
      <div class="viewer-badge">👁️ <span id="viewer-count">0</span> viewers</div>
    </div>
    <div class="share-box">
      <span class="share-url" id="share-url"></span>
      <button class="copy-btn" id="copy-btn">Copy Link</button>
    </div>
    <div class="stream-controls">
      <button class="ctrl-btn" id="mic-btn">🎤 Mute</button>
      <button class="ctrl-btn" id="cam-btn">📷 Hide Camera</button>
      <button class="ctrl-btn" id="screen-btn">🖥️ Share Screen</button>
      <button class="ctrl-btn danger" id="end-btn">⏹ End Stream</button>
    </div>
  </div>
  {% else %}
  <div class="not-logged">
    <p style="font-size:1.2rem;margin-bottom:12px;">🔴 Go Live</p>
    <p><a href="/login">Sign in</a> to start streaming</p>
  </div>
  {% endif %}
</div>

<div class="toast" id="toast"></div>

<script>
const AGORA_APP_ID = '12e74aedf9af43ba91472232295fc6c7';
const AGORA_CHANNEL = 'vaultstream';
let AGORA_TOKEN = null;
let client = null;
let localVideoTrack = null;
let localAudioTrack = null;
let screenTrack = null;
let streamId = null;
let micOn = true;
let camOn = true;
let screenSharing = false;

document.getElementById('go-live-btn').addEventListener('click', startStream);
document.getElementById('copy-btn').addEventListener('click', copyLink);
document.getElementById('mic-btn').addEventListener('click', toggleMic);
document.getElementById('cam-btn').addEventListener('click', toggleCam);
document.getElementById('screen-btn').addEventListener('click', toggleScreenShare);
document.getElementById('end-btn').addEventListener('click', endStream);

async function startStream() {
  const title = document.getElementById('stream-title').value.trim() || 'Live Stream';
  try {
    showToast('Starting stream...');

    // Get token from server
    const tokenRes = await fetch('/agora_token?role=publisher');
    const tokenData = await tokenRes.json();
    if (tokenData.error) throw new Error(tokenData.error);
    AGORA_TOKEN = tokenData.token;

    // Create stream record
    const res = await fetch('/start_stream', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({title})
    });
    const data = await res.json();
    if (!data.success) throw new Error('Could not start stream');
    streamId = data.stream_id;

    // Join Agora
    client = AgoraRTC.createClient({ mode: 'live', codec: 'vp8' });
    await client.setClientRole('host');
    await client.join(AGORA_APP_ID, AGORA_CHANNEL, AGORA_TOKEN, null);

    // Create tracks
    [localAudioTrack, localVideoTrack] = await AgoraRTC.createMicrophoneAndCameraTracks();
    localVideoTrack.play('local-video');
    await client.publish([localAudioTrack, localVideoTrack]);

    // Viewer events
    client.on('user-joined', () => {
      document.getElementById('viewer-count').textContent = client.remoteUsers.length;
      showToast('👁️ Someone joined!');
    });
    client.on('user-left', () => {
      document.getElementById('viewer-count').textContent = client.remoteUsers.length;
    });

    // Show stream UI
    document.getElementById('setup-card').style.display = 'none';
    document.getElementById('stream-wrap').classList.add('show');
    const shareUrl = window.location.origin + '/watch_live/' + streamId;
    document.getElementById('share-url').textContent = shareUrl;
    showToast('🔴 You are live!');

  } catch(e) {
    console.error(e);
    showToast('❌ Error: ' + e.message);
  }
}

async function toggleMic() {
  micOn = !micOn;
  if (localAudioTrack) await localAudioTrack.setEnabled(micOn);
  document.getElementById('mic-btn').textContent = micOn ? '🎤 Mute' : '🔇 Unmute';
}

async function toggleCam() {
  camOn = !camOn;
  if (localVideoTrack) await localVideoTrack.setEnabled(camOn);
  document.getElementById('cam-btn').textContent = camOn ? '📷 Hide Camera' : '📷 Show Camera';
}

async function toggleScreenShare() {
  const btn = document.getElementById('screen-btn');
  if (!screenSharing) {
    try {
      screenTrack = await AgoraRTC.createScreenVideoTrack({}, 'disable');
      await client.unpublish(localVideoTrack);
      await client.publish(screenTrack);
      screenTrack.play('local-video');
      screenSharing = true;
      btn.textContent = '📷 Back to Camera';
      btn.style.color = 'var(--accent)';
      screenTrack.on('track-ended', switchBackToCamera);
      showToast('🖥️ Screen sharing!');
    } catch(e) { showToast('❌ Could not share screen'); }
  } else {
    switchBackToCamera();
  }
}

async function switchBackToCamera() {
  if (screenTrack) {
    await client.unpublish(screenTrack);
    screenTrack.close();
    screenTrack = null;
  }
  if (localVideoTrack) {
    await client.publish(localVideoTrack);
    localVideoTrack.play('local-video');
  }
  screenSharing = false;
  document.getElementById('screen-btn').textContent = '🖥️ Share Screen';
  document.getElementById('screen-btn').style.color = '';
  showToast('📷 Back to camera');
}

async function endStream() {
  if (!confirm('End your stream?')) return;
  if (localAudioTrack) localAudioTrack.close();
  if (localVideoTrack) localVideoTrack.close();
  if (screenTrack) screenTrack.close();
  if (client) await client.leave();
  if (streamId) await fetch('/end_stream/' + streamId, {method: 'POST'});
  showToast('Stream ended!');
  setTimeout(() => window.location = '/', 1500);
}

function copyLink() {
  navigator.clipboard.writeText(document.getElementById('share-url').textContent);
  showToast('✅ Link copied!');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3500);
}
</script>
</body>
</html>
