<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Signing in... — VaultStream</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
body { background: #0f0f0f; color: #f1f1f1; font-family: 'Roboto', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; flex-direction: column; gap: 16px; }
.spinner { width: 40px; height: 40px; border: 3px solid #333; border-top-color: #ff0000; border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="spinner"></div>
<div>Signing you in...</div>
<script>
// Get token from URL hash
const hash = window.location.hash.substring(1);
const params = new URLSearchParams(hash);
const accessToken = params.get('access_token');

if (accessToken) {
  // Send token to server to create session
  fetch('/auth/set_session', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({access_token: accessToken})
  }).then(r => r.json()).then(res => {
    if (res.success) window.location = '/';
    else window.location = '/login';
  });
} else {
  window.location = '/login';
}
</script>
</body>
</html>
