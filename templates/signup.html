<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1673723146227353" crossorigin="anonymous"></script>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — VaultStream</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap');
:root { --bg: #0f0f0f; --surface: #1a1a1a; --border: #3f3f3f; --text: #f1f1f1; --text2: #aaaaaa; --accent: #ff0000; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Roboto', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 36px; width: 90%; max-width: 400px; }
.logo { display: flex; align-items: center; gap: 8px; margin-bottom: 28px; justify-content: center; text-decoration: none; color: var(--text); }
.logo-icon { background: var(--accent); color: white; padding: 6px 10px; border-radius: 8px; font-size: 1rem; font-weight: 700; }
.logo-text { font-size: 1.3rem; font-weight: 700; }
h2 { font-size: 1.2rem; margin-bottom: 20px; text-align: center; }
.field { margin-bottom: 14px; }
label { display: block; font-size: 0.82rem; color: var(--text2); margin-bottom: 5px; }
input { width: 100%; background: #111; border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; color: var(--text); font-size: 0.9rem; font-family: 'Roboto', sans-serif; outline: none; transition: border 0.2s; }
input:focus { border-color: var(--accent); }
.btn { width: 100%; padding: 11px; border-radius: 8px; border: none; background: var(--accent); color: white; font-size: 0.95rem; font-weight: 500; font-family: 'Roboto', sans-serif; cursor: pointer; margin-top: 8px; transition: background 0.2s; }
.btn:hover { background: #cc0000; }
.link { text-align: center; margin-top: 16px; font-size: 0.82rem; color: var(--text2); }
.link a { color: var(--accent); text-decoration: none; }
.error { background: rgba(255,0,0,0.1); border: 1px solid rgba(255,0,0,0.3); border-radius: 8px; padding: 10px 14px; font-size: 0.82rem; color: #ff6b6b; margin-bottom: 16px; }
</style>
</head>
<body>
<div class="card">
  <a href="/" class="logo"><div class="logo-icon">VS</div><div class="logo-text">VaultStream</div></a>
  <h2>Create account</h2>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="POST">
    <div class="field"><label>Username</label><input type="text" name="username" required placeholder="cooluser123"></div>
    <div class="field"><label>Email</label><input type="email" name="email" required placeholder="you@email.com"></div>
    <div class="field"><label>Password</label><input type="password" name="password" required placeholder="min 6 characters"></div>
    <button class="btn" type="submit">Create account</button>
  </form>
  <div style="display:flex;align-items:center;gap:10px;margin:16px 0;">
    <div style="flex:1;height:1px;background:#3f3f3f;"></div>
    <span style="font-size:0.75rem;color:#666;">or sign up with</span>
    <div style="flex:1;height:1px;background:#3f3f3f;"></div>
  </div>
  <a href="/auth/google" style="display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:10px;border-radius:8px;border:1px solid #3f3f3f;background:#111;color:#f1f1f1;text-decoration:none;font-size:0.88rem;font-family:'Roboto',sans-serif;transition:background 0.2s;">
    <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
    Continue with Google
  </a>
  <div class="link" style="margin-top:16px;">Already have an account? <a href="/login">Sign in</a></div>
</div>
</body>
</html>
