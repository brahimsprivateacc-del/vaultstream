<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ video.title }} — VAULTSTREAM</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;600&display=swap');
:root {
  --bg: #0a0a0c; --card: #16161e; --border: #22222e;
  --accent: #e8ff47; --accent2: #ff4757; --text: #f0f0f8; --muted: #4a4a62; --sub: #8888aa;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; }

nav {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 32px; border-bottom: 1px solid var(--border);
  background: rgba(10,10,12,0.95); backdrop-filter: blur(12px);
}
.logo { font-family: 'Bebas Neue'; font-size: 1.8rem; letter-spacing: 3px; color: var(--accent); text-decoration: none; }
.logo span { color: var(--text); }
.back-btn {
  padding: 8px 16px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--card); color: var(--sub); font-size: 0.82rem;
  cursor: pointer; transition: all 0.2s; text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
}
.back-btn:hover { border-color: var(--accent); color: var(--accent); }

.player-wrap {
  max-width: 1100px; margin: 32px auto; padding: 0 24px;
}

video {
  width: 100%; border-radius: 12px; background: #000;
  box-shadow: 0 20px 60px rgba(0,0,0,0.8);
  border: 1px solid var(--border);
}

.video-info {
  margin-top: 20px; padding: 20px 24px;
  background: var(--card); border: 1px solid var(--border); border-radius: 12px;
  display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap;
}

.info-left h1 { font-size: 1.2rem; font-weight: 600; margin-bottom: 6px; }
.info-meta { font-family: 'JetBrains Mono'; font-size: 0.65rem; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }

.actions { display: flex; gap: 8px; }
.action-btn {
  padding: 8px 16px; border-radius: 6px; border: 1px solid var(--border);
  background: transparent; color: var(--sub); font-size: 0.78rem; cursor: pointer; transition: all 0.2s;
  text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
}
.action-btn:hover { border-color: var(--accent); color: var(--accent); }
.action-btn.danger:hover { border-color: var(--accent2); color: var(--accent2); }

.offline-tip {
  margin-top: 14px; padding: 12px 16px;
  background: rgba(232,255,71,0.04); border: 1px solid rgba(232,255,71,0.15);
  border-radius: 8px; font-family: 'JetBrains Mono'; font-size: 0.65rem; color: var(--sub); line-height: 1.7;
}
.offline-tip strong { color: var(--accent); }
</style>
</head>
<body>

<nav>
  <a href="/" class="logo">VAULT<span>STREAM</span></a>
  <a href="/" class="back-btn">← Back to Library</a>
</nav>

<div class="player-wrap">

  <!-- VIDEO PLAYER -->
  <video controls autoplay>
    <source src="/videos/{{ video.filename }}" type="video/{{ 'mp4' if video.extension == 'MP4' else 'webm' if video.extension == 'WEBM' else 'mp4' }}">
    Your browser doesn't support this video format. Try a different browser.
  </video>

  <!-- VIDEO INFO -->
  <div class="video-info">
    <div class="info-left">
      <h1>{{ video.title }}</h1>
      <div class="info-meta">
        <span>📁 {{ video.filename }}</span>
        <span>💾 {{ video.size }}</span>
        <span>🎞 {{ video.extension }}</span>
        <span>🟢 Stored locally</span>
      </div>
    </div>
    <div class="actions">
      <a href="/videos/{{ video.filename }}" download class="action-btn">💾 Download</a>
      <button class="action-btn danger" onclick="deleteAndGoHome('{{ video.filename }}')">🗑 Delete</button>
    </div>
  </div>

  <div class="offline-tip">
    💡 <strong>Offline mode:</strong> This video is stored on your local drive. You can watch it even without internet — just run <code>python app.py</code> and open your browser!
  </div>

</div>

<script>
function deleteAndGoHome(filename) {
  if (!confirm('Delete this video? This cannot be undone.')) return;
  fetch('/delete/' + filename, { method: 'POST' })
    .then(r => r.json())
    .then(res => {
      if (res.success) window.location = '/';
    });
}
</script>
</body>
</html>
